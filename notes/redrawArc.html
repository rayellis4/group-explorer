 <html>
   <head>
      <title>Illustration for DiagramDnD</title>

      <style type="text/css">
       canvas {
          border: 1px solid black;
       }
      </style>
      <script type="importmap">
       {
          "imports": {
             "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
             "three/lines/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/lines/"
          }
       }
      </script> 
      <script type="module">
         import * as THREE from "three"
         import { Line2 } from "three/lines/Line2.js"
         import { LineMaterial } from "three/lines/LineMaterial.js"
         import { LineGeometry } from "three/lines/LineGeometry.js"

       window.addEventListener('load', load, {once: true});

       const WIDTH = 900
       const HEIGHT = 600

       function load() {
          // Scene
          const scene = new THREE.Scene();

          // Renderer
          const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true, antialias: true});
          renderer.setSize(WIDTH, HEIGHT);
          renderer.setClearColor('white', 1.0);
          document.getElementById('graphic').appendChild(renderer.domElement);

          // Camera
          const camera = new THREE.PerspectiveCamera(30, WIDTH/HEIGHT, 0.1, 2000);
          camera.position.set(-3.69, 1.10, 2.67);
          camera.up.set(0.40, 0.96, 0.03);
          camera.lookAt(new THREE.Vector3(0, 0, 0));

          // Light
          scene.add(new THREE.AmbientLight());

          const MID = new THREE.Vector3(0, 0, 0)
          const START = new THREE.Vector3(-1, 0, 0)
          const END = new THREE.Vector3(1, 0, 0)
          const Y0 = new THREE.Vector3(0, 0.3, 0)
          const YMAX = new THREE.Vector3(0, 0.4, 0)
          const PICK = new THREE.Vector3(-0.4, y(-0.4, YMAX.y), 0)
          const PROJ = new THREE.Vector3(-0.4, 0, 0)
          const CENTER = new THREE.Vector3(0, -1, 0)
          const CAMERA = new THREE.Vector3(0, -0.35, 1)
          const ORIGIN = new THREE.Vector3(0, -0.35, -0.2)
          const RAY = new THREE.Vector3().addScaledVector(PICK, 0.4).addScaledVector(CAMERA, 0.6)
          const PAST = new THREE.Vector3().addScaledVector(PICK, 1.2).addScaledVector(CAMERA, -0.2)
          const U = new THREE.Vector3(0.2, 0, 0).add(START)
          const V = new THREE.Vector3(0, 0.2, 0).add(START)

          scene.add(makeSphere(START, 0.02));
          scene.add(makeSphere(START, 0.06, {color: '#8C8C8C', opacity: 0.7, transparent: true}));
          scene.add(makeSphere(END, 0.02));
          scene.add(makeSphere(END, 0.06, {color: '#8C8C8C', opacity: 0.7, transparent: true}));
          scene.add(makeSphere(PICK, 0.02));
          scene.add(makeSphere(CENTER, 0.02));

          const THICK = 3
          const MEDIUM = 2
          const THIN = 1
          scene.add(makeLine([CENTER, START], {linewidth: THIN, dashed: true}));
          scene.add(makeArrowhead([CENTER, START], 'black'));
          scene.add(makeLine([END, CENTER], {linewidth: THIN, dashed: true}));
          scene.add(makeArrowhead([END, CENTER], 'black'));
          scene.add(makeLine([START, END]));
          scene.add(makeLine([ORIGIN, CAMERA], {color: 'blue'}));
          scene.add(makeArrowhead([ORIGIN, CAMERA], 'blue'));
          scene.add(makeLine([CAMERA, PAST], {color: 'red'}));
          scene.add(makeLine([CAMERA, RAY], {linewidth: THICK}))
          scene.add(makeArrowhead([CAMERA, RAY], 'black'));

          scene.add(makeLine([START, PICK], {linewidth: MEDIUM}));
          scene.add(makeArrowhead([START, PICK], 'black'));
          scene.add(makeLine([PICK, END], {linewidth: MEDIUM}));
          scene.add(makeArrowhead([PICK, END], 'black'));
          scene.add(makeLine([PICK, PROJ], {}));
          scene.add(makeLine([MID, YMAX], {}));
          scene.add(makeLine([START, U], {linewidth: MEDIUM, color: 'red'}));
          scene.add(makeArrowhead([START, U], 'red'));
          scene.add(makeLine([START, V], {linewidth: MEDIUM, color: 'red'}));
          scene.add(makeArrowhead([START, V], 'red'));

          scene.add(makeCurve([START, YMAX, END], {dashed: true}));
          scene.add(makeCurve([START, Y0, END], {color: 'gray', dashed: true}));

          scene.add(makeLabel(new THREE.Vector3(0, -0.04, 0).add(U), 'U', 0.03, 'red', 20));
          scene.add(makeLabel(new THREE.Vector3(0, -0.04, 0).add(V), 'V', -0.015, 'red', 20));
          scene.add(makeLabel(new THREE.Vector3(-0.1, 0.07, 0).add(PAST), 'pickLine', -0.05, 'black', 20));
          scene.add(makeLabel(new THREE.Vector3(0, 0.01, 0).add(RAY), 'raycaster.ray.direction', -0.1, 'black', 20));
          scene.add(makeLabel(new THREE.Vector3(0, -0.05, 0).add(CAMERA), 'raycaster.ray.origin', 0.13, 'black', 20));
          scene.add(makeLabel(new THREE.Vector3(0, 0.03, 0).add(CAMERA), 'Camera', -0.03, 'black', 30));
          scene.add(makeLabel(new THREE.Vector3(0, 0, 0).add(ORIGIN), 'Origin', 0.25, 'black', 30));
          scene.add(makeLabel(new THREE.Vector3(0, -0.01, 0).add(PICK), 'pick', 0.16, 'black', 24));
          scene.add(makeLabel(new THREE.Vector3(0, 0, 0).add(START), 'start', 0.25, 'black', 30));
          scene.add(makeLabel(new THREE.Vector3(0, 0.05, 0).add(END), 'end', -0.1, 'black', 40));
          scene.add(makeLabel(new THREE.Vector3(0, -0.1, 0).add(CENTER), 'thirdPoint', 0.22, 'black', 36));
          scene.add(makeLabel(new THREE.Vector3(-0.4, y(0.0, YMAX.y) + 0.19, 0), 'New Arc', -0.05, 'black', 36));
          scene.add(makeLabel(new THREE.Vector3(0.4, y(0.4, Y0.y) + 0.04, 0), 'Old Arc', -0.0, 'gray', 36));

          let obj
          scene.add(obj =
             makeText(new THREE.Vector3(-0.12, 0, 0).addScaledVector(PROJ, 0.6).addScaledVector(PICK, 0.4), 'vPick', 'black', 20));
          obj.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI/2);
          scene.add(
             makeText(new THREE.Vector3(0, 0.08, 0).addScaledVector(START, 0.55).addScaledVector(PROJ, 0.45), 'uPick', 'black', 20));
          scene.add(
             makeText(new THREE.Vector3(-0.1, -0.01, 0).add(MID), 'chord', 'black', 20));
          scene.add(obj =
             makeText(new THREE.Vector3(-0.12, -0.05, 0).addScaledVector(MID, 0.5).addScaledVector(YMAX, 0.5), 'offset', 'black', 20));
          obj.quaternion.setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI/2);

          // showAxes(scene);
          renderer.render(scene, camera);

          // to create foo.png file from result:
          console.log(renderer.domElement.toDataURL('image/png'))
          //   copy logged text out and remove leading "data:image/png;base64," in editor
          //   store resulting string as foo.base64
          //   base64 -d < foo.base64 > foo.png
       }

       function makeText (location, text, color = 'black', font_size = 20) {
          const LABEL_WIDTH = 128
          const LABEL_HEIGHT = 32
          const scale = 0.0025

          //          const canvas = $(`<canvas width="${LABEL_WIDTH}" height="${LABEL_HEIGHT}"></canvas>`)[0];
          const canvas = document.createElement('canvas')
          canvas.setAttribute('width', LABEL_WIDTH)
          canvas.setAttribute('height', LABEL_HEIGHT)
          const context = canvas.getContext('2d');

          context.font = `italic ${font_size}pt Arial`;
          const text_width = context.measureText(text).width;
          const margin = 5;

          //context.fillStyle = 'rgba(255, 0, 255, 0.2)';
          //context.fillRect(0, 0, canvas.width, canvas.height);

          context.textBaseline = 'middle';
          context.fillStyle = color;
          context.fillText(text, 0, LABEL_HEIGHT/2);

          const texture = new THREE.CanvasTexture(canvas);
          const label_material = new THREE.MeshBasicMaterial({
             map: texture,
             side: THREE.DoubleSide,
             transparent: true,
             opacity: 1,
             //depthWrite: false,
          });
          const geometry = new THREE.PlaneGeometry(canvas.width, canvas.height);
          const label = new THREE.Mesh(geometry, label_material);
          label.scale.set(scale, scale, 1);
          label.position.set(location.x + scale*LABEL_WIDTH/2, location.y - scale*LABEL_HEIGHT/2 , location.z);
          
          return label;
       }

       function makeSphere (location, radius, properties = {color: '#000000'}) {
          const material = new THREE.MeshPhongMaterial(properties);
          const geometry = new THREE.SphereGeometry(radius, 10, 10);
          const sphere = new THREE.Mesh(geometry, material);
          sphere.position.set(...location.toArray());

          return sphere;
       }

       function y(x, y0) {
          return -y0*(x-1)*(x+1);
       }

       function makeCurve ([start, middle, end], passedOptions = {}) {
          const middleControl = new THREE.Vector3(middle.x, 2*middle.y, middle.z)
          const curve = new THREE.QuadraticBezierCurve3(start, middleControl, end)
          const vertices = curve.getPoints(20)
          const curvedLine = makeLine(vertices, passedOptions)

          return curvedLine
       }

       function makeLine (vertices, passedOptions = {}) {
          const defaultOptions = {
             color: 'black',
             linewidth: 1,
             dashed: false,
             dashScale: 2.5,
             dashSize: 0.1,
             gapSize: 0.1,             
             resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
          }
          const options = Object.assign({}, defaultOptions, passedOptions)
          const geometry = new LineGeometry()
          geometry.setPositions(
             vertices.reduce((positions, vertex) => (positions.push(vertex.x, vertex.y, vertex.z), positions), [])
          )
          const lineMaterial = new LineMaterial(options)
          const newLine = new Line2(geometry, lineMaterial)
          newLine.computeLineDistances();

          return newLine;
       }

       function makeArrowhead (vertices, color = 'black') {
          const l = vertices[1].clone().sub(vertices[0])
          const ll = l.length()
          const t = 1 - 0.21 / ll
          const origin = vertices[0].clone().multiplyScalar(1-t).addScaledVector(vertices[1], t)
          const line = vertices[1].clone().sub(origin)
          const length = line.length()
          const dir = line.normalize()
          const head_length = Math.min(0.13, 0.3*new THREE.Line3(vertices[0], vertices[1]).distance())
          const arrowhead = new THREE.ArrowHelper(dir, origin, length, color, head_length, 0.3*head_length)

          return arrowhead;
       }

       function makeLabel (location, text, x_offset = 0, color = 'black', label_font) {
          const canvas = document.createElement('canvas')
          const context = canvas.getContext('2d')
          const text_width = context.measureText(text).width
          const short_text = (text_width < 150)
          const label_width = short_text ? 512 : 2048
          const label_height = 64
          const scale = short_text ? 1 : 4
          canvas.width = label_width;
          canvas.height = label_height;
          context.font = `${label_font}pt Arial`;
          //context.fillStyle = 'rgba(0, 0, 100, 0.5)';
          //context.fillRect(0, 0, canvas.width, canvas.height);
          context.fillStyle = color;
          context.fillText(text, 0, 0.7*label_height);
          //console.log(`${text} -- ${text_width} -- ${label_width}`);

          const texture = new THREE.CanvasTexture(canvas),
                labelMaterial = new THREE.SpriteMaterial({
                   map: texture,
                   side: THREE.DoubleSide,
                   transparent: true,
                   opacity: 1,
                   depthWrite: false,
                }),
                label = new THREE.Sprite(labelMaterial);
          label.scale.set(scale, scale*canvas.height/canvas.width, 1.0);
          label.center = new THREE.Vector2(x_offset/scale, 0.5);
          label.position.set(...location.toArray());
          
          return label;
       }

       function makePlane (position) {
          const geometry = new THREE.PlaneGeometry(3.1, 2.1);
          material = new THREE.MeshBasicMaterial({
             color: '#E8C8C8',
             opacity: 0.4,
             transparent: true,
             depthWrite: false,
             //depthTest: false,
          }),
                plane = new THREE.Mesh(geometry, material);
          plane.position.set(...position.toArray());

          return plane;
       }

       function showAxes (scene) {
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(2,0,0)], {color: 'red'}));
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(0,2,0)], {color: 'green'}));
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,2)], {color: 'blue'}));
                }
      </script>
   </head>
   <body>
      <div id="graphic"></div>
   </body>
</html>
