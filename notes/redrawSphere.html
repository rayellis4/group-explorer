<html>
   <head>
      <title>Illustration for DiagramDnD</title>

      <style type="text/css">
       canvas {
          border: 1px solid black;
       }
      </style>
      <script type="importmap">
       {
          "imports": {
             "three": "https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js",
             "three/lines/": "https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/lines/"
          }
       }
      </script> 
      <script type="module">
       import * as THREE from "three"
       import { Line2 } from "three/lines/Line2.js"
       import { LineMaterial } from "three/lines/LineMaterial.js"
       import { LineGeometry } from "three/lines/LineGeometry.js"

       window.addEventListener('load', load, {once: true});

       const WIDTH = 900
       const HEIGHT = 600

       function load() {
          // Scene
          const scene = new THREE.Scene()

          // Renderer
          const renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true, antialias: true});
          renderer.setSize(WIDTH, HEIGHT);
          renderer.setClearColor('white', 1.0);
          document.getElementById('graphic').appendChild(renderer.domElement);

          // Camera
          const camera = new THREE.PerspectiveCamera(41, WIDTH/HEIGHT, 0.1, 2000);
          camera.position.set(5.5, 3.3, 2);
          camera.up.set(0, 0, 1.0);
          camera.lookAt(new THREE.Vector3(-1, -1, -0.5));

          // Light
          scene.add(new THREE.AmbientLight());

          const Origin = new THREE.Vector3(1, -0.2, -2)
          const Camera = new THREE.Vector3(1, -0.2, 2)
          const P = Origin.clone().add(Camera).multiplyScalar(0.5)      // origin-camera line intersects nodePlane
          const S = new THREE.Vector3(0, 0, 0)                         // current position
          const R = new THREE.Vector3(0, 1.5, 0)                       // new position
          const r = R.clone().sub(Camera).normalize().add(Camera)       // camera-newPosition unit vector
          const c = Camera.clone().sub(Origin).normalize().add(Origin)  // origin-camera unit vector

          scene.add(makeSphere(S.toArray(), 0.02));
          scene.add(makeSphere(S.toArray(), 0.08, {color: '#8C8C8C', opacity: 0.7, transparent: true}));
          scene.add(makeSphere(R.toArray(), 0.02));
          scene.add(makeSphere(R.toArray(), 0.08, {color: '#8C8C8C', opacity: 0.7, transparent: true}));

          const THICK = 3
          const MEDIUM = 2
          const THIN = 1
          scene.add(makeLine([Origin, c], {linewidth: THICK}))
          scene.add(makeLine([c, Camera], {linewidth: MEDIUM, color: 'blue'}))
          scene.add(makeArrowhead([Origin, Camera], 'blue'));
          scene.add(makeArrowhead([Origin, new THREE.Vector3(1, -0.2, -1)]));
          scene.add(makeLine([Camera, r], {linewidth: THICK}))
          scene.add(makeArrowhead([Camera, r]));
          scene.add(makeLine([r, r.clone().addScaledVector(R.clone().sub(r), 1.3)], {linewidth: MEDIUM, color: 'red'}))
          scene.add(makeLine([Origin, S], {linewidth: MEDIUM}))
          scene.add(makeArrowhead([Origin, S]));
          scene.add(makeLine([Origin, R], {linewidth: MEDIUM}))
          scene.add(makeArrowhead([Origin, R]));
          scene.add(makeLine([S, R], {lineWidth: THIN, dashed: true}))

          scene.add(makeLine([P, S], {linewidth: THIN}))
          scene.add(makeLine([new THREE.Vector3(0, 0, -0.15).add(P),
                              new THREE.Vector3(0, 0, -0.15).add(P).addScaledVector(S.clone().sub(P), 0.07),
                              P.clone().addScaledVector(S.clone().sub(P), 0.07)],
                             {linewidth: THIN}))

          scene.add(makeLabel(new THREE.Vector3(0, 0, -0.1).add(Origin), 'Origin', 0.26, 72));
          scene.add(makeLabel(new THREE.Vector3(0, 0, 0.1).add(Camera), 'Camera', 0.25, 55));
          scene.add(makeLabel(new THREE.Vector3(0, 0, -0.15).add(Camera), 'raycaster.ray.origin', 1.05, 45));
          scene.add(makeLabel(new THREE.Vector3(0, 0.5, 0.25).add(S), 'currentPosition', 0.85, 55));
          scene.add(makeLabel(new THREE.Vector3(0.5, 0.3, 0.2).add(R), 'newPosition', 0.05, 55));

          scene.add(makeLabel(Origin.clone().multiplyScalar(0.78).addScaledVector(Camera, 0.22), 'cameraDirection', 1.2, 55));
          scene.add(makeLabel(Camera.clone().multiplyScalar(0.6).addScaledVector(r, 0.4), 'raycaster.ray.direction', -0.15, 45));
          scene.add(makeLabel(Camera.clone().multiplyScalar(0.45).addScaledVector(R, 0.55), 'pickLine', -0.15, 45));
          scene.add(makeLabel(new THREE.Vector3(1.5, -1.5, 0), 'nodePlane', 0, 85));

          scene.add(makePlane(new THREE.Vector3(0, 0, 0)));

          // showAxes(scene) // for debugging
          renderer.render(scene, camera)

          // to create foo.png file from result:
          console.log(renderer.domElement.toDataURL('image/png'))
          //   copy logged text out and remove leading "data:image/png;base64," in editor
          //   store resulting string as foo.base64
          //   base64 -d < foo.base64 > foo.png
       }

       function makeSphere (location, radius, properties = {color: '#000000'}) {
          const material = new THREE.MeshPhongMaterial(properties);
          const geometry = new THREE.SphereGeometry(radius, 10, 10);
          const sphere = new THREE.Mesh(geometry, material);
          sphere.position.set(...location);

          return sphere;
       }

       function makeLine (vertices, passedOptions = {}) {
          const defaultOptions = {
             color: 'black',
             linewidth: 1,
             resolution: new THREE.Vector2(window.innerWidth, window.innerHeight),
             dashed: false,
             dashScale: 1,
             dashSize: 0.1,
             gapSize: 0.1,
          }
          const options = Object.assign({}, defaultOptions, passedOptions)
          const geometry = new LineGeometry()
          geometry.setPositions(
             vertices.reduce((positions, vertex) => (positions.push(vertex.x, vertex.y, vertex.z), positions), [])
          )
          const lineMaterial = new LineMaterial(options)
          const newLine = new Line2(geometry, lineMaterial)
          newLine.computeLineDistances()

          return newLine;
       }

       function makeArrowhead (vertices, color = 'black') {
          const l = vertices[1].clone().sub(vertices[0])
          const ll = l.length()
          const t = 1 - 0.21 / ll
          const origin = vertices[0].clone().multiplyScalar(1-t).addScaledVector(vertices[1], t)
          const line = vertices[1].clone().sub(origin)
          const length = line.length()
          const dir = line.normalize()
          const headLength = 0.2
          const arrowhead = new THREE.ArrowHelper(dir, origin, length, color, headLength, 0.5*headLength)

          return arrowhead;
       }

       function makeLabel (location, text, xOffset = 0, labelFont, color = 'black') {
          const canvas = document.createElement('canvas')
          const context = canvas.getContext('2d')
          const textWidth = context.measureText(text).width
          const shortText = (textWidth < 150)
          const labelWidth = shortText ? 1024 : 2048
          const labelHeight = 128
          const scale = shortText ? 2 : 4

          canvas.width = labelWidth;
          canvas.height = labelHeight;
          context.font = `${labelFont}pt Arial`;
          context.fillStyle = color;
          context.fillText(text, 0, 0.7*labelHeight);

          const texture = new THREE.CanvasTexture(canvas)
          const labelMaterial = new THREE.SpriteMaterial({
             map: texture,
             side: THREE.DoubleSide,
             transparent: true,
             opacity: 1,
             depthWrite: false,
          })
          const label = new THREE.Sprite(labelMaterial)
          label.scale.set(scale, scale*canvas.height/canvas.width, 1.0);
          label.center = new THREE.Vector2(xOffset/scale, 0.5);
          label.position.set(...location.toArray());
          
          return label;
       }

       function makePlane (position) {
          const geometry = new THREE.PlaneGeometry(4,4,1,1);
          const material = new THREE.MeshBasicMaterial({
             color: '#E8C8C8',
             opacity: 0.4,
             transparent: true,
             depthWrite: false
          });
          const plane = new THREE.Mesh(geometry, material);
          plane.position.set(...position.toArray());

          return plane;
       }

       function showAxes (scene) {
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(2,0,0)], {color: 'red'}));
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(0,2,0)], {color: 'green'}));
          scene.add(makeLine([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,2)], {color: 'blue'}));
       }
      </script>
   </head>
   <body>
      <div id="graphic"></div>
   </body>
</html>
